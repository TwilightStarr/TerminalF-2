name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Statik analiz
        run: flutter analyze --no-fatal-infos
      - name: Testler
        run: flutter test
